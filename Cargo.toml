[package]
name = "ferrum-app-developers"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The Developer Hub: the workspace's API reference, the events it gives, and people's API keys"
repository = "https://github.com/CBFerrum/ferrum-app-developers"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }

[dev-dependencies]
ferrum-apps = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
